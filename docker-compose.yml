services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: identiq
      POSTGRES_PASSWORD: identiq
      POSTGRES_DB: identiq
    ports:
      - "5432:5432"
    volumes:
      - identiq-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U identiq"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  identiq-postgres-data:
